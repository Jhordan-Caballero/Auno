<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Atención - Admin Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="navbar-admin">
    <div class="brand">AUNO - Administración</div>
    <div>
        <a th:href="@{/admin/citas}" class="active">Control de Citas</a>
        <a th:href="@{/admin/horarios}">Gestión de Horarios</a>
        <a th:href="@{/admin/doctores}">Doctores</a>
        <a th:href="@{/admin/especialidades}">Especialidades</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container container-md">

    <a th:href="@{/admin/citas}" class="back-link">⬅️ Cancelar y volver a la lista</a>

    <h2 class="page-header">🩺 Registrar Historial Clínico</h2>

    <div class="info-card">
        <div class="info-row">
            <strong>Paciente:</strong> <span th:text="${cita.paciente.usuario.nombres + ' ' + cita.paciente.usuario.apellidos}"></span>
        </div>
        <div class="info-row">
            <strong>Doctor Asignado:</strong> <span th:text="${'Dr. ' + cita.doctor.nombres + ' ' + cita.doctor.apellidos}"></span>
        </div>
        <div class="info-row">
            <strong>Fecha de la Cita:</strong> <span th:text="${cita.horario.fecha}"></span>
        </div>
    </div>

    <form th:action="@{/admin/citas/atender}" th:object="${historialDTO}" method="POST" class="card-container" style="max-width: 100%; padding: 30px;" novalidate>

        <input type="hidden" th:field="*{citaId}">

        <div class="form-group">
            <label class="form-label">Motivo de Consulta:</label>
            <input type="text" class="form-control" th:field="*{motivoConsulta}" placeholder="Ej. Dolor de cabeza frecuente">
            <span class="error-text" th:if="${#fields.hasErrors('motivoConsulta')}" th:errors="*{motivoConsulta}"></span>
        </div>

        <div class="form-group">
            <label class="form-label">Diagnóstico:</label>
            <textarea class="form-control" th:field="*{diagnostico}" rows="3" placeholder="Detalle el diagnóstico médico..."></textarea>
            <span class="error-text" th:if="${#fields.hasErrors('diagnostico')}" th:errors="*{diagnostico}"></span>
        </div>

        <div class="form-group">
            <label class="form-label">Recomendaciones (Tratamiento/Receta):</label>
            <textarea class="form-control" th:field="*{recomendaciones}" rows="3" placeholder="Medicamentos, reposo, terapias..."></textarea>
            <span class="error-text" th:if="${#fields.hasErrors('recomendaciones')}" th:errors="*{recomendaciones}"></span>
        </div>

        <div class="form-group">
            <label class="form-label">Observaciones Adicionales <span class="text-opcional">(Opcional)</span>:</label>
            <textarea class="form-control" th:field="*{observaciones}" rows="2"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-dark">Guardar Historial y Finalizar Cita</button>
    </form>
</div>

</body>
</html>
