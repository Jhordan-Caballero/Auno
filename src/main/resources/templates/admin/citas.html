<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Citas - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #007bff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-atender { background-color: #28a745; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.85em; color: white; }
        .bg-pendiente { background-color: #ffc107; color: black; }
        .bg-atendida { background-color: #17a2b8; }
        .bg-cancelada { background-color: #dc3545; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .nav-menu { margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nav-menu a { text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-menu">
        <a th:href="@{/admin/horarios}">⬅️ Volver a Horarios</a>
        <a th:href="@{/logout}" style="color: red;">🚪 Cerrar Sesión</a>
    </div>

    <h2>📋 Control General de Citas</h2>

    <div th:if="${param.exito}" class="alert-success" th:text="${param.exito}"></div>
    <div th:if="${param.error}" class="alert-error" th:text="${param.error}"></div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Doctor</th>
            <th>Fecha y Hora</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cita : ${listaCitas}">
            <td th:text="${cita.id}"></td>
            <td th:text="${cita.paciente.usuario.nombres + ' ' + cita.paciente.usuario.apellidos}"></td>
            <td th:text="${'Dr. ' + cita.doctor.nombres}"></td>
            <td th:text="${cita.horario.fecha + ' ' + cita.horario.horaInicio}"></td>
            <td>
                <span th:classappend="${cita.estado == 'PENDIENTE' ? 'badge bg-pendiente' : (cita.estado == 'ATENDIDA' ? 'badge bg-atendida' : 'badge bg-cancelada')}" th:text="${cita.estado}"></span>
            </td>
            <td>
                <!-- Botón para registrar el historial solo si está pendiente -->
                <a th:if="${cita.estado == 'PENDIENTE' or cita.estado == 'PROGRAMADA'}"
                   th:href="@{/admin/citas/atender(citaId=${cita.id})}"
                   class="btn-atender">🩺 Atender</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaCitas)}">
            <td colspan="6" style="text-align: center;">No hay citas registradas en el sistema.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
