<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Citas - Admin Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="navbar-admin">
    <div class="brand">AUNO - Administración</div>
    <div>
        <a th:href="@{/admin/citas}" class="active">Control de Citas</a>
        <a th:href="@{/admin/horarios}">Gestión de Horarios</a>
        <a th:href="@{/admin/doctores}">Doctores</a>
        <a th:href="@{/admin/especialidades}">Especialidades</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container container-lg">

    <h2 class="page-header">📋 Control General de Citas</h2>

    <div th:if="${param.exito}" class="alert-success" th:text="${param.exito}"></div>
    <div th:if="${param.error}" class="alert-error" th:text="${param.error}"></div>

    <table class="table-modern">
        <thead>
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Doctor</th>
            <th>Fecha y Hora</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cita : ${listaCitas}">
            <td style="font-weight: 600;" th:text="${cita.id}"></td>
            <td style="color: var(--text-dark); font-weight: 500;" th:text="${cita.paciente.usuario.nombres + ' ' + cita.paciente.usuario.apellidos}"></td>
            <td th:text="${'Dr. ' + cita.doctor.nombres}"></td>
            <td th:text="${cita.horario.fecha + ' ' + cita.horario.horaInicio}"></td>
            <td>
                <span th:classappend="${cita.estado == 'PENDIENTE' ? 'badge bg-pendiente' : (cita.estado == 'ATENDIDA' ? 'badge bg-atendida' : 'badge bg-cancelada')}" th:text="${cita.estado}"></span>
            </td>
            <td>
                <a th:if="${cita.estado == 'PENDIENTE' or cita.estado == 'PROGRAMADA'}"
                   th:href="@{/admin/citas/atender(citaId=${cita.id})}"
                   class="btn-atender">🩺 Atender</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaCitas)}">
            <td colspan="6" style="text-align: center; padding: 30px;">No hay citas registradas en el sistema.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
