<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Doctores - Admin Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- Navbar Administrador -->
<div class="navbar-admin">
    <div class="brand">AUNO - Administración</div>
    <div>
        <a th:href="@{/admin/citas}">Control de Citas</a>
        <a th:href="@{/admin/horarios}">Gestión de Horarios</a>
        <a th:href="@{/admin/doctores}" class="active">Doctores</a>
        <a th:href="@{/admin/especialidades}">Especialidades</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container container-lg">

    <h2 class="page-header">👨‍⚕️ Registrar Perfil Médico</h2>

    <div th:if="${param.exito}" class="alert-success">¡Doctor registrado exitosamente!</div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <!-- Formulario con estilo de tarjeta -->
    <form th:action="@{/admin/doctores/registro}" th:object="${doctorDTO}" method="POST" class="card-container" style="max-width: 100%; padding: 30px; margin-bottom: 40px;" novalidate>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Nombres:</label>
                <input type="text" class="form-control" th:field="*{nombres}" placeholder="Ej. Carlos">
                <span class="error-text" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></span>
            </div>
            <div class="form-group">
                <label class="form-label">Apellidos:</label>
                <input type="text" class="form-control" th:field="*{apellidos}" placeholder="Ej. Mendoza">
                <span class="error-text" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Nro. Colegiatura (CMP):</label>
                <input type="text" class="form-control" th:field="*{numeroColegiatura}" placeholder="Ej. 123456">
                <span class="error-text" th:if="${#fields.hasErrors('numeroColegiatura')}" th:errors="*{numeroColegiatura}"></span>
            </div>
            <div class="form-group">
                <label class="form-label">Especialidad Asignada:</label>
                <select class="form-control" th:field="*{especialidadId}">
                    <option value="">-- Seleccione Especialidad --</option>
                    <option th:each="esp : ${listaEspecialidades}" th:value="${esp.id}" th:text="${esp.nombre}"></option>
                </select>
                <span class="error-text" th:if="${#fields.hasErrors('especialidadId')}" th:errors="*{especialidadId}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Correo Electrónico de Contacto:</label>
                <input type="email" class="form-control" th:field="*{correoContacto}" placeholder="doctor@auno.com">
                <span class="error-text" th:if="${#fields.hasErrors('correoContacto')}" th:errors="*{correoContacto}"></span>
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono de Contacto <span class="text-opcional">(Opcional)</span>:</label>
                <input type="text" class="form-control" th:field="*{telefonoContacto}" placeholder="Ej. 987654321">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Descripción / Perfil <span class="text-opcional">(Opcional)</span>:</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="2" placeholder="Breve perfil profesional..."></textarea>
        </div>

        <button type="submit" class="btn-primary btn-dark">Guardar Registro Médico</button>
    </form>

    <h2 class="page-header">📋 Catálogo de Médicos</h2>
    <table class="table-modern">
        <thead>
        <tr>
            <th>Colegiatura</th>
            <th>Nombre Completo</th>
            <th>Especialidad</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="doc : ${listaDoctores}">
            <td style="font-weight: 600;" th:text="${doc.numeroColegiatura}"></td>
            <td style="color: var(--text-dark); font-weight: 500;" th:text="${doc.nombres + ' ' + doc.apellidos}"></td>
            <td th:text="${doc.especialidad.nombre}"></td>
            <td>
                <!-- Reutilizamos el badge verde para Activo -->
                <span class="badge bg-atendida" th:text="${doc.estado}"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaDoctores)}">
            <td colspan="4" style="text-align: center; padding: 30px;">No hay médicos registrados en la base de datos.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
