<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Doctores - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #28a745; padding-bottom: 10px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #28a745; color: white; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error-text { color: red; font-size: 0.9em; }
        .nav-menu { margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nav-menu a { text-decoration: none; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-menu">
        <a th:href="@{/admin/especialidades}">⬅️ Volver a Especialidades</a>
        <a th:href="@{/logout}" style="color: red;">🚪 Cerrar Sesión</a>
    </div>

    <h2>Registrar Perfil Médico</h2>

    <div th:if="${param.exito}" class="alert-success">¡Doctor registrado exitosamente!</div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/admin/doctores/registro}" th:object="${doctorDTO}" method="POST" novalidate>

        <div class="form-row">
            <div class="form-group">
                <label>Nombres:</label>
                <input type="text" th:field="*{nombres}">
                <span class="error-text" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></span>
            </div>
            <div class="form-group">
                <label>Apellidos:</label>
                <input type="text" th:field="*{apellidos}">
                <span class="error-text" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nro. Colegiatura:</label>
                <input type="text" th:field="*{numeroColegiatura}">
                <span class="error-text" th:if="${#fields.hasErrors('numeroColegiatura')}" th:errors="*{numeroColegiatura}"></span>
            </div>
            <div class="form-group">
                <label>Especialidad Asignada:</label>
                <select th:field="*{especialidadId}">
                    <option value="">-- Seleccione Especialidad --</option>
                    <!-- Aquí Thymeleaf itera sobre la lista de especialidades -->
                    <option th:each="esp : ${listaEspecialidades}" th:value="${esp.id}" th:text="${esp.nombre}"></option>
                </select>
                <span class="error-text" th:if="${#fields.hasErrors('especialidadId')}" th:errors="*{especialidadId}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Correo Electrónico de Contacto:</label>
                <input type="email" th:field="*{correoContacto}">
                <span class="error-text" th:if="${#fields.hasErrors('correoContacto')}" th:errors="*{correoContacto}"></span>
            </div>
            <div class="form-group">
                <label>Teléfono de Contacto:</label>
                <input type="text" th:field="*{telefonoContacto}">
            </div>
        </div>

        <div class="form-group">
            <label>Descripción / Perfil:</label>
            <textarea th:field="*{descripcion}" rows="2"></textarea>
        </div>

        <button type="submit">Guardar Registro Médico</button>
    </form>

    <h2 style="margin-top: 40px;">Catálogo de Médicos</h2>
    <table>
        <thead>
        <tr>
            <th>Colegiatura</th>
            <th>Nombre Completo</th>
            <th>Especialidad</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="doc : ${listaDoctores}">
            <td th:text="${doc.numeroColegiatura}"></td>
            <!-- Concatenamos nombres y apellidos -->
            <td th:text="${doc.nombres + ' ' + doc.apellidos}"></td>
            <!-- Accedemos al nombre de la especialidad anidada -->
            <td th:text="${doc.especialidad.nombre}"></td>
            <td th:text="${doc.estado}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaDoctores)}">
            <td colspan="4" style="text-align: center;">No hay médicos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
