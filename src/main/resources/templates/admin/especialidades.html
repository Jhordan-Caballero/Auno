<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Especialidades - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error-text { color: red; font-size: 0.9em; }
        .nav-menu { margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nav-menu a { text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-menu">
        <a th:href="@{/admin/doctores}">🩺 Ir a Gestión de Doctores</a>
        <a th:href="@{/logout}" style="color: red;">🚪 Cerrar Sesión</a>
    </div>

    <h2>Registrar Especialidad</h2>

    <div th:if="${param.exito}" class="alert-success">¡Especialidad registrada exitosamente!</div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/admin/especialidades/registro}" th:object="${especialidadDTO}" method="POST" novalidate>
        <div class="form-group">
            <label>Nombre de la Especialidad:</label>
            <input type="text" th:field="*{nombre}" placeholder="Ej. Cardiología">
            <span class="error-text" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
            <label>Descripción:</label>
            <textarea th:field="*{descripcion}" rows="3" placeholder="Breve descripción..."></textarea>
        </div>
        <button type="submit">Guardar Especialidad</button>
    </form>

    <h2 style="margin-top: 40px;">Lista de Especialidades</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="esp : ${listaEspecialidades}">
            <td th:text="${esp.id}"></td>
            <td th:text="${esp.nombre}"></td>
            <td th:text="${esp.descripcion}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaEspecialidades)}">
            <td colspan="3" style="text-align: center;">No hay especialidades registradas en la base de datos.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
