<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Especialidades - Admin Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- Navbar Administrador -->
<div class="navbar-admin">
    <div class="brand">AUNO - Administración</div>
    <div>
        <a th:href="@{/admin/citas}">Control de Citas</a>
        <a th:href="@{/admin/horarios}">Gestión de Horarios</a>
        <a th:href="@{/admin/doctores}">Doctores</a>
        <a th:href="@{/admin/especialidades}" class="active">Especialidades</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container container-lg">

    <h2 class="page-header">🩺 Registrar Especialidad</h2>

    <div th:if="${param.exito}" class="alert-success">¡Especialidad registrada exitosamente!</div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/admin/especialidades/registro}" th:object="${especialidadDTO}" method="POST" class="card-container" style="max-width: 100%; padding: 30px; margin-bottom: 40px;" novalidate>
        <div class="form-group">
            <label class="form-label">Nombre de la Especialidad:</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Cardiología">
            <span class="error-text" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
            <label class="form-label">Descripción <span class="text-opcional">(Opcional)</span>:</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="3" placeholder="Breve descripción del área médica..."></textarea>
        </div>
        <button type="submit" class="btn-primary btn-dark" style="width: auto; padding: 12px 30px;">Guardar Especialidad</button>
    </form>

    <h2 class="page-header">📋 Lista de Especialidades</h2>
    <table class="table-modern">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="esp : ${listaEspecialidades}">
            <td style="font-weight: 600;" th:text="${esp.id}"></td>
            <td style="color: var(--text-dark); font-weight: 500;" th:text="${esp.nombre}"></td>
            <td th:text="${esp.descripcion}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaEspecialidades)}">
            <td colspan="3" style="text-align: center; padding: 30px;">No hay especialidades registradas en la base de datos.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
