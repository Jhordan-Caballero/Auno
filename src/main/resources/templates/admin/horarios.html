<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Horarios - Admin Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- Navbar Administrador -->
<div class="navbar-admin">
    <div class="brand">AUNO - Administración</div>
    <div>
        <a th:href="@{/admin/citas}">Control de Citas</a>
        <a th:href="@{/admin/horarios}" class="active">Gestión de Horarios</a>
        <a th:href="@{/admin/doctores}">Doctores</a>
        <a th:href="@{/admin/especialidades}">Especialidades</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container container-lg">

    <h2 class="page-header">⏰ Aperturar Turnos Médicos</h2>

    <div th:if="${param.exito}" class="alert-success">¡Turno registrado exitosamente!</div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/admin/horarios/registro}" th:object="${horarioDTO}" method="POST" class="card-container" style="max-width: 100%; padding: 30px; margin-bottom: 40px;" novalidate>

        <div class="form-group">
            <label class="form-label">Médico Asignado:</label>
            <select class="form-control" th:field="*{doctorId}">
                <option value="">-- Seleccione un Médico --</option>
                <option th:each="doc : ${listaDoctores}"
                        th:value="${doc.id}"
                        th:text="${doc.nombres + ' ' + doc.apellidos + ' (' + doc.especialidad.nombre + ')'}">
                </option>
            </select>
            <span class="error-text" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Fecha del Turno:</label>
                <input type="date" class="form-control" th:field="*{fecha}">
                <span class="error-text" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>
            </div>
            <div class="form-group">
                <label class="form-label">Hora de Inicio:</label>
                <input type="time" class="form-control" th:field="*{horaInicio}">
                <span class="error-text" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></span>
            </div>
            <div class="form-group">
                <label class="form-label">Hora de Fin:</label>
                <input type="time" class="form-control" th:field="*{horaFin}">
                <span class="error-text" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></span>
            </div>
        </div>

        <button type="submit" class="btn-primary btn-dark" style="width: auto; padding: 12px 30px;">Crear Bloque de Horario</button>
    </form>

    <h2 class="page-header">📋 Turnos Registrados</h2>
    <table class="table-modern">
        <thead>
        <tr>
            <th>Médico</th>
            <th>Fecha</th>
            <th>Horario</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hor : ${listaHorarios}">
            <td style="color: var(--text-dark); font-weight: 500;" th:text="${hor.doctor.nombres + ' ' + hor.doctor.apellidos}"></td>
            <td th:text="${hor.fecha}"></td>
            <td th:text="${hor.horaInicio + ' - ' + hor.horaFin}"></td>
            <td>
                <!-- Reutilizamos las clases de badges del styles.css -->
                <span th:if="${hor.estado == 'DISPONIBLE'}" class="badge bg-atendida">Disponible</span>
                <span th:if="${hor.estado != 'DISPONIBLE'}" class="badge bg-cancelada" th:text="${hor.estado}"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaHorarios)}">
            <td colspan="4" style="text-align: center; padding: 30px;">No hay turnos registrados en el sistema.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
