<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Horarios - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #17a2b8; padding-bottom: 10px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="date"], input[type="time"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #17a2b8; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #17a2b8; color: white; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error-text { color: red; font-size: 0.9em; }
        .nav-menu { margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nav-menu a { text-decoration: none; color: #17a2b8; font-weight: bold; }
        .badge-disponible { background-color: #28a745; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.85em; }
        .badge-reservado { background-color: #dc3545; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-menu">
        <a th:href="@{/admin/doctores}">⬅️ Volver a Doctores</a>
        <a th:href="@{/logout}" style="color: red;">🚪 Cerrar Sesión</a>
    </div>

    <h2>Aperturar Turnos Médicos</h2>

    <div th:if="${param.exito}" class="alert-success">¡Turno registrado exitosamente!</div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/admin/horarios/registro}" th:object="${horarioDTO}" method="POST" novalidate>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Médico Asignado:</label>
            <select th:field="*{doctorId}">
                <option value="">-- Seleccione un Médico --</option>
                <option th:each="doc : ${listaDoctores}"
                        th:value="${doc.id}"
                        th:text="${doc.nombres + ' ' + doc.apellidos + ' (' + doc.especialidad.nombre + ')'}">
                </option>
            </select>
            <span class="error-text" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Fecha del Turno:</label>
                <input type="date" th:field="*{fecha}">
                <span class="error-text" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>
            </div>
            <div class="form-group">
                <label>Hora de Inicio (Ej. 09:00):</label>
                <input type="time" th:field="*{horaInicio}">
                <span class="error-text" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></span>
            </div>
            <div class="form-group">
                <label>Hora de Fin (Ej. 09:30):</label>
                <input type="time" th:field="*{horaFin}">
                <span class="error-text" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></span>
            </div>
        </div>

        <button type="submit">Crear Bloque de Horario</button>
    </form>

    <h2 style="margin-top: 40px;">Turnos Registrados</h2>
    <table>
        <thead>
        <tr>
            <th>Médico</th>
            <th>Fecha</th>
            <th>Horario</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hor : ${listaHorarios}">
            <td th:text="${hor.doctor.nombres + ' ' + hor.doctor.apellidos}"></td>
            <td th:text="${hor.fecha}"></td>
            <td th:text="${hor.horaInicio + ' - ' + hor.horaFin}"></td>
            <td>
                <span th:if="${hor.estado == 'DISPONIBLE'}" class="badge-disponible">Disponible</span>
                <span th:if="${hor.estado != 'DISPONIBLE'}" class="badge-reservado" th:text="${hor.estado}"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaHorarios)}">
            <td colspan="4" style="text-align: center;">No hay turnos registrados en el sistema.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
