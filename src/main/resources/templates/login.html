<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clínica Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="center-wrapper">
    <!-- max-width más pequeño para el login -->
    <div class="card-container" style="max-width: 450px;">
        <h2 class="header-title">Iniciar Sesión</h2>

        <!-- Mensajes del sistema (usando las clases del CSS global) -->
        <div th:if="${param.error}" class="alert-error">
            Correo o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert-success">
            Has cerrado sesión correctamente.
        </div>
        <div th:if="${param.exito}" class="alert-success">
            ¡Registro exitoso! Ahora puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">Correo Electrónico</label>
                <input class="form-control" type="text" id="username" name="username" placeholder="correo@ejemplo.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button class="btn-primary" type="submit">Entrar a mi cuenta</button>
        </form>

        <div class="footer-link">
            ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
        </div>
    </div>
</div>

</body>
</html>
