<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Sistema de Citas Médicas</title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo-medico">
            ♡
        </div>

        <h1>Bienvenido</h1>

        <p class="subtitle">
            Inicia sesión para continuar
        </p>

        <div th:if="${error}"
             class="alert alert-error"
             th:text="${error}">
        </div>

        <form th:action="@{/login}"
              method="post">

            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                        id="correo"
                        name="correo"
                        type="email"
                        class="form-control"
                        placeholder="correo@ejemplo.com"
                        required>
            </div>

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                        id="password"
                        name="password"
                        type="password"
                        class="form-control"
                        placeholder="Contraseña"
                        required>

            </div>

            <div class="auth-links"
                 style="text-align:right;margin-bottom:18px;">

                <a href="#">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

            <button type="submit"
                    class="btn btn-primary">

                Iniciar sesión

            </button>

        </form>

        <div class="auth-links">

            ¿No tienes cuenta?

            <a th:href="@{/registro}">
                Regístrate
            </a>

        </div>

    </div>

</div>

</body>
</html>
