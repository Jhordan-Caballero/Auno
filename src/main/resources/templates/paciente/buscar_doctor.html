<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - Clínica Auno</title>

    <!-- Fuente Inter y CSS Global -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- Navbar Unificada -->
<div class="navbar">
    <div class="brand-container">
        <img th:src="@{/imagenes/Logo_Auno.png}" alt="Logo Auno" class="logo-img" style="height: 100px;">
    </div>
    <div class="nav-links">
        <a th:href="@{/paciente/reservar}" class="active">Nueva Cita</a>
        <a th:href="@{/paciente/mis-citas}">Historial</a>
        <a th:href="@{/paciente/diagnosticos}">Mis Diagnósticos</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<!-- Contenedor Principal -->
<div class="dashboard-container">

    <div th:if="${param.reservaExito}" class="alert-success">
        ¡Cita reservada exitosamente! Te hemos enviado un correo de confirmación.
    </div>

    <h2 class="page-header">📅 Buscar Médico</h2>

    <!-- Filtro por Especialidad -->
    <form th:action="@{/paciente/reservar}" method="GET" class="filtro-box">
        <div class="form-group">
            <label class="form-label" style="margin-bottom: 8px;">Filtrar por Especialidad:</label>
            <select name="especialidadId" class="form-control">
                <option value="">-- Todas las Especialidades --</option>
                <option th:each="esp : ${listaEspecialidades}"
                        th:value="${esp.id}"
                        th:text="${esp.nombre}"
                        th:selected="${esp.id == especialidadSeleccionada}">
                </option>
            </select>
        </div>
        <button type="submit" class="btn-primary">🔍 Buscar Médico</button>
    </form>

    <!-- Lista de Doctores -->
    <h3 style="color: var(--text-dark); margin-bottom: 15px;">Médicos Disponibles</h3>

    <div th:if="${#lists.isEmpty(listaDoctores)}" class="empty-state">
        <p>No hay médicos registrados en esta especialidad actualmente.</p>
    </div>

    <div th:each="doc : ${listaDoctores}" class="doctor-card">
        <div class="doctor-info">
            <h4 th:text="${'Dr. ' + doc.nombres + ' ' + doc.apellidos}"></h4>
            <p th:text="${'Especialidad: ' + doc.especialidad.nombre}"></p>
            <p th:text="${'CMP: ' + doc.numeroColegiatura}"></p>
        </div>
        <div>
            <a th:href="@{/paciente/reservar/horarios(doctorId=${doc.id})}" class="btn-reservar">
                Ver Horarios ➡️
            </a>
        </div>
    </div>
</div>

</body>
</html>
