<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Diagnósticos y Recetas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #17a2b8; padding-bottom: 10px; color: #17a2b8; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-bottom: 15px; background-color: #fff; border-left: 5px solid #17a2b8; }
        .card h4 { margin-top: 0; color: #333; }
        .card p { margin: 5px 0; color: #555; }
        .etiqueta { font-weight: bold; color: #333; }
        .nav-menu { margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nav-menu a { text-decoration: none; color: #0056b3; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-menu">
        <a th:href="@{/paciente/mis-citas}">⬅️ Volver a Mis Citas</a>
        <a th:href="@{/logout}" style="color: red;">🚪 Cerrar Sesión</a>
    </div>

    <h2>🩺 Mis Resultados Médicos</h2>

    <div th:if="${#lists.isEmpty(listaDiagnosticos)}">
        <p style="color: #666;">Aún no tienes atenciones médicas registradas.</p>
    </div>

    <div th:each="historial : ${listaDiagnosticos}" class="card">
        <h4 th:text="${'Fecha de Atención: ' + historial.fecha}"></h4>
        <p><span class="etiqueta">Doctor:</span> <span th:text="${'Dr. ' + historial.cita.doctor.nombres + ' ' + historial.cita.doctor.apellidos}"></span></p>
        <p><span class="etiqueta">Motivo de Consulta:</span> <span th:text="${historial.motivoConsulta}"></span></p>
        <hr style="border-top: 1px dashed #ccc;">
        <p><span class="etiqueta">Diagnóstico:</span> <span th:text="${historial.diagnostico}"></span></p>
        <p><span class="etiqueta">Recomendaciones / Receta:</span> <span th:text="${historial.recomendaciones}"></span></p>
        <p th:if="${historial.observaciones != null and !historial.observaciones.isEmpty()}">
            <span class="etiqueta">Observaciones:</span> <span th:text="${historial.observaciones}"></span>
        </p>
    </div>
</div>

</body>
</html>
