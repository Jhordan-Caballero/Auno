<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Diagnósticos - Clínica Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="navbar">
    <div class="brand-container">
        <img th:src="@{/imagenes/Logo_Auno.png}" alt="Logo Auno" class="logo-img" style="height: 100px;">
    </div>
    <div class="nav-links">
        <a th:href="@{/paciente/reservar}">Nueva Cita</a>
        <a th:href="@{/paciente/mis-citas}">Historial</a>
        <a th:href="@{/paciente/diagnosticos}" class="active">Mis Diagnósticos</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container">

    <h2 class="page-header">🩺 Mis Resultados Médicos y Recetas</h2>

    <div th:if="${#lists.isEmpty(listaDiagnosticos)}" class="empty-state">
        <p>Aún no tienes atenciones médicas registradas o diagnósticos emitidos.</p>
    </div>

    <div th:each="historial : ${listaDiagnosticos}" class="diagnosis-card">
        <h4 th:text="${'Fecha de Atención: ' + historial.fecha}"></h4>

        <div class="diagnosis-row">
            <div class="etiqueta">Doctor Tratante:</div>
            <div class="valor" th:text="${'Dr. ' + historial.cita.doctor.nombres + ' ' + historial.cita.doctor.apellidos}"></div>
        </div>

        <div class="diagnosis-row">
            <div class="etiqueta">Motivo de Consulta:</div>
            <div class="valor" th:text="${historial.motivoConsulta}"></div>
        </div>

        <div class="diagnosis-row">
            <div class="etiqueta">Diagnóstico Clínico:</div>
            <div class="valor" style="color: var(--text-dark); font-weight: 500;" th:text="${historial.diagnostico}"></div>
        </div>

        <div class="diagnosis-row">
            <div class="etiqueta">Tratamiento / Receta:</div>
            <div class="valor" th:text="${historial.recomendaciones}"></div>
        </div>

        <div class="diagnosis-row" th:if="${historial.observaciones != null and !historial.observaciones.isEmpty()}">
            <div class="etiqueta">Observaciones Extra:</div>
            <div class="valor" th:text="${historial.observaciones}"></div>
        </div>
    </div>

</div>

</body>
</html>
