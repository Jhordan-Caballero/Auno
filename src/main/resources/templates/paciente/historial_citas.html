<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Historial - Clínica Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="navbar">
    <div class="brand-container">
        <img th:src="@{/imagenes/Logo_Auno.png}" alt="Logo Auno" class="logo-img" style="height: 100px;">
    </div>
    <div class="nav-links">
        <a th:href="@{/paciente/reservar}">Nueva Cita</a>
        <a th:href="@{/paciente/mis-citas}" class="active">Historial</a>
        <a th:href="@{/paciente/diagnosticos}">Mis Diagnósticos</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container">

    <div th:if="${param.cancelada}" class="alert-success">
        Tu cita ha sido cancelada correctamente. El horario ha sido liberado.
    </div>

    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">📋 Mi Historial Médico</h2>
        <a th:href="@{/paciente/reservar}" class="btn-outline">➕ Nueva Reserva</a>
    </div>

    <table class="table-modern">
        <thead>
        <tr>
            <th>Fecha y Hora</th>
            <th>Médico</th>
            <th>Especialidad</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cita : ${listaCitas}">
            <td th:text="${cita.horario.fecha + ' (' + cita.horario.horaInicio + ')'}"></td>
            <td style="font-weight: 500; color: var(--text-dark);" th:text="${'Dr. ' + cita.doctor.nombres + ' ' + cita.doctor.apellidos}"></td>
            <td th:text="${cita.doctor.especialidad.nombre}"></td>
            <td>
                <span th:if="${cita.estado == 'PENDIENTE'}" class="badge bg-pendiente">Pendiente</span>
                <span th:if="${cita.estado == 'CANCELADA'}" class="badge bg-cancelada">Cancelada</span>
                <span th:if="${cita.estado == 'ATENDIDA'}" class="badge bg-atendida">Atendida</span>
                <span th:if="${cita.estado == 'NO ASISTIÓ'}" class="badge bg-cancelada">No Asistió</span>
            </td>
            <td>
                <form th:if="${cita.estado == 'PENDIENTE'}" th:action="@{/paciente/mis-citas/cancelar}" method="POST" onsubmit="return confirm('¿Estás seguro de que deseas cancelar esta cita?');">
                    <input type="hidden" name="citaId" th:value="${cita.id}">
                    <button type="submit" class="btn-cancelar">Cancelar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaCitas)}">
            <td colspan="5" style="text-align: center; padding: 30px; color: var(--text-muted);">No tienes citas registradas en tu historial.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
