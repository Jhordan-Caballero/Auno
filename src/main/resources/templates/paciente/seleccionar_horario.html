<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Horario - Clínica Auno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="navbar">
    <div class="brand-container">
        <img th:src="@{/imagenes/Logo_Auno.png}" alt="Logo Auno" class="logo-img" style="height: 100px;">
    </div>
    <div class="nav-links">
        <a th:href="@{/paciente/reservar}" class="active">Nueva Cita</a>
        <a th:href="@{/paciente/mis-citas}">Historial</a>
        <a th:href="@{/paciente/diagnosticos}">Mis Diagnósticos</a>
        <a th:href="@{/logout}" class="logout">Cerrar Sesión</a>
    </div>
</div>

<div class="dashboard-container" style="max-width: 700px;">

    <a th:href="@{/paciente/reservar}" class="back-link">⬅️ Volver a buscar médicos</a>

    <h2 class="page-header">⏰ Horarios Disponibles</h2>

    <div th:if="${#lists.isEmpty(horariosDisponibles)}" class="empty-state">
        <p style="color: var(--error-color); font-weight: 600; margin: 0;">Lo sentimos, este médico no tiene horarios disponibles por el momento.</p>
    </div>

    <div th:each="horario : ${horariosDisponibles}" class="horario-card">
        <div class="horario-info">
            <strong th:text="${'📅 Fecha: ' + horario.fecha}"></strong>
            <span th:text="${'🕒 Hora: ' + horario.horaInicio + ' - ' + horario.horaFin}"></span>
        </div>

        <form th:action="@{/paciente/reservar/confirmar}" method="POST" style="margin: 0;">
            <input type="hidden" name="horarioId" th:value="${horario.id}">
            <button type="submit" class="btn-primary" style="width: auto; margin-top: 0; padding: 10px 20px;">✅ Reservar</button>
        </form>
    </div>

</div>

</body>
</html>
