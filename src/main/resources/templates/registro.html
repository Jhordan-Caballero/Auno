<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - Clínica Auno</title>

    <!-- Fuente Inter de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- Usamos la clase wrapper para centrar toda la tarjeta -->
<div class="center-wrapper">
    <div class="card-container">
        <h2 class="header-title">Crear Cuenta</h2>

        <!-- Alerta de error -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/registro}" th:object="${pacienteDTO}" method="post" novalidate>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="nombres">Nombres</label>
                    <input class="form-control" type="text" id="nombres" th:field="*{nombres}" placeholder="Ej. Juan Pérez">
                    <span class="error-text" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="apellidos">Apellidos</label>
                    <input class="form-control" type="text" id="apellidos" th:field="*{apellidos}" placeholder="Ej. Gómez">
                    <span class="error-text" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Correo Electrónico</label>
                <input class="form-control" type="email" id="email" th:field="*{email}" placeholder="correo@ejemplo.com">
                <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input class="form-control" type="password" id="password" th:field="*{password}" placeholder="Crea una contraseña">
                    <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="telefono">Teléfono <span class="text-opcional">(Opcional)</span></label>
                    <input class="form-control" type="text" id="telefono" th:field="*{telefono}" placeholder="Ej. 987654321">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="fechaNacimiento">Fecha de Nacimiento</label>
                <input class="form-control" type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}">
                <span class="error-text" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="direccion">Dirección <span class="text-opcional">(Opcional)</span></label>
                <input class="form-control" type="text" id="direccion" th:field="*{direccion}" placeholder="Ej. Av. Siempre Viva 123">
            </div>

            <button class="btn-primary" type="submit">Registrarme</button>
        </form>

        <div class="footer-link">
            ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
        </div>
    </div>
</div>

</body>
</html>
