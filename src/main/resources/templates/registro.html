<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro de paciente</title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Crear cuenta de paciente</h1>

        <p class="subtitle">
            Completa tus datos para registrarte
        </p>

        <form th:action="@{/registro}"
              th:object="${paciente}"
              method="post">

            <div class="form-group">

                <label>Nombres</label>

                <input
                        type="text"
                        th:field="*{nombres}"
                        class="form-control"
                        required>

            </div>

            <div class="form-group">

                <label>Apellidos</label>

                <input
                        type="text"
                        th:field="*{apellidos}"
                        class="form-control"
                        required>

            </div>

            <div class="form-group">

                <label>Correo electrónico</label>

                <input
                        type="email"
                        th:field="*{correo}"
                        class="form-control"
                        required>

            </div>

            <div class="form-group">

                <label>DNI</label>

                <input
                        type="text"
                        th:field="*{dni}"
                        class="form-control"
                        maxlength="8"
                        required>

            </div>

            <div class="reservation-grid">

                <div class="form-group">

                    <label>Fecha de nacimiento</label>

                    <input
                            type="date"
                            th:field="*{fechaNacimiento}"
                            class="form-control"
                            required>

                </div>

                <div class="form-group">

                    <label>Género</label>

                    <select
                            th:field="*{genero}"
                            class="form-control">

                        <option value="">
                            Seleccionar
                        </option>

                        <option value="MASCULINO">
                            Masculino
                        </option>

                        <option value="FEMENINO">
                            Femenino
                        </option>

                        <option value="OTRO">
                            Otro
                        </option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label>Teléfono</label>

                <input
                        type="tel"
                        th:field="*{telefono}"
                        class="form-control">

            </div>

            <div class="form-group">

                <label>Contraseña</label>

                <input
                        type="password"
                        th:field="*{password}"
                        class="form-control"
                        required>

            </div>

            <div class="form-group">

                <label>
                    <input type="checkbox" required>

                    Acepto los
                    <a href="#">términos y condiciones</a>
                </label>

            </div>

            <button
                    type="submit"
                    class="btn btn-primary">

                Registrarme

            </button>

        </form>

        <div class="auth-links">

            ¿Ya tienes cuenta?

            <a th:href="@{/login}">
                Inicia sesión
            </a>

        </div>

    </div>

</div>

</body>
</html>
