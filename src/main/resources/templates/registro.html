<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Pacientes - Sistema Médico</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="password"], input[type="date"] {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .error-text { color: red; font-size: 0.9em; display: block; margin-top: 5px; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 3px;}
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Paciente</h2>

    <!-- Error manual enviado desde el controlador (ej. Correo ya registrado) -->
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${pacienteDTO}" method="post">

        <div class="form-group">
            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" th:field="*{nombres}">
            <span class="error-text" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></span>
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" th:field="*{apellidos}">
            <span class="error-text" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" th:field="*{email}">
            <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" th:field="*{password}">
            <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}">
        </div>

        <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}">
            <span class="error-text" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>
        </div>

        <div class="form-group">
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" th:field="*{direccion}">
        </div>

        <button type="submit">Registrar</button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
    </p>
</div>

</body>
</html>
